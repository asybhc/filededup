name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # 语料路径清单哈希跨平台必须一致；语料改动时需同步更新 tools/corpusgen 的 golden 常量。
  CORPUS_SEED: "20260113"

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        shell: bash
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "以下文件未格式化："
            echo "$out"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test ./...

      - name: corpus 可复现性（跨平台一致）
        shell: bash
        run: |
          go run ./tools/corpusgen -out "${{ runner.temp }}/corpus" -seed "$CORPUS_SEED" | tee corpus.out
          grep -q "pathListSHA256: 6ffaff777d4cc947e561fb061eb5f7fb0454ff8d73c1b1d7bab0bfc29c380273" corpus.out || {
            echo "路径清单哈希与 golden 不符"; exit 1;
          }

      - name: parity 13 场景（对 golden 回归）
        shell: bash
        run: go run ./tools/parity scenes -corpus "${{ runner.temp }}/corpus" -golden testdata/golden/scan

      - name: parity 工具自检
        run: go test ./tools/parity/ -run . -count=1 -v

  organize-parity:
    # 整理器对拍矩阵：与 testdata/golden/organize 中归档的 C# 结果逐组比对。
    # 只在 Windows 跑：hidden 场景依赖 Windows 隐藏属性，且基准是在 Windows 上采集的。
    runs-on: windows-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 整理器对拍（17 场景 × 2 顺序 × 3 冲突 × 2 试运行）
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP "organize"
          go run ./tools/parity organize-batch --golden testdata/golden/organize --work $work --matrix --out (Join-Path $work "summary.json")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $s = Get-Content (Join-Path $work "summary.json") -Raw | ConvertFrom-Json
          "MATCH=$($s.match) KNOWN=$($s.known) TOTAL=$($s.total)"

      - name: 上传对拍 summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: organize-parity-summary
          path: ${{ runner.temp }}/organize/summary.json
          if-no-files-found: ignore
